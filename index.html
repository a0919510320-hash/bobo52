<header class="hero"><div class="hero-inner"><div class="eyebrow">A LITTLE TRIP, A BIG CELEBRATION</div><div class="headline"><h1>Bobo 的生日旅行<span>把三天，留給喜歡的風景。</span></h1><div class="age" aria-label="52歲">52</div></div><p class="date">2026.09.26 六 — 09.28 一 · 三天兩夜</p><div class="route">台中 <b>／</b> 日月潭 <b>／</b> 埔里</div></div></header>

<main id="content"></main>
<footer class="footer"><strong>Happy 52, Bobo.</strong><br>一起吃好、走走，留下新的回憶。</footer>

<script>
'use strict';
const days=[
{title:'台中散步・生日晚餐',intro:'從老城區的小吃出發，今晚好好慶祝。',highlight:['18:00 極炙牛排館','生日晚餐｜出發前確認訂位與實際用餐分店。'],stops:[
['出發','交通','三重 → 台中','帶著好心情出發，第一站到第二市場吃午餐。','台中第二市場'],

['午後','甜點時光','第四信用合作社','留一點胃口給甜點，慢慢欣賞老建築。','台中 第四信用合作社'],
['午後','街區散策','審計新村','逛小店、拍照，享受午後散步時光。','台中 審計新村'],

]},
{title:'日月潭湖景・埔里滋味',intro:'今天往山裡走，湖景、在地美食與甜點一次收藏。',highlight:['日月潭 → 埔里 → 台中','景點停留依車程與體力調整，晚餐後回台中商旅休息。'],stops:[

]},

const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m20 4-6 16-3-7-7-3 16-6Z" stroke-linejoin="round"/></svg>';

const tabs=Array.from(document.querySelectorAll('[role=tab]'));
function selectDay(index,focus=false){tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1;document.getElementById('day-'+(i+1)).hidden=i!==index;});if(focus)tabs[index].focus();}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>{selectDay(i);const top=document.querySelector('.tabs-wrap').offsetTop;if(window.scrollY>top)window.scrollTo({top,behavior:'instant'});});tab.addEventListener('keydown',e=>{let next=i;if(e.key==='ArrowRight')next=(i+1)%3;else if(e.key==='ArrowLeft')next=(i+2)%3;else if(e.key==='Home')next=0;else if(e.key==='End')next=2;else return;e.preventDefault();selectDay(next,true);});});
